name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
            platform: linux
            arch: x86_64
            binary: dist/jar
          - os: ubuntu-24.04-arm
            label: linux-arm64
            platform: linux
            arch: arm64
            binary: dist/jar
          - os: windows-2025
            label: windows-x86_64
            platform: windows
            arch: x86_64
            binary: dist/jar.exe
          - os: macos-15-intel
            label: macos-x86_64
            platform: macos
            arch: x86_64
            binary: dist/jar
          - os: macos-14
            label: macos-arm64
            platform: macos
            arch: arm64
            binary: dist/jar
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libxcb1 libx11-xcb1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Smoke test desktop startup
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_gui.py

      - name: Build CLI binary
        run: pyinstaller --clean --noconfirm packaging/jar-cli.spec

      - name: Build desktop binary
        run: pyinstaller --clean --noconfirm packaging/jar-desktop.spec

      - name: Smoke test CLI binary
        run: python scripts/smoke_test.py "${{ matrix.binary }}"
        env:
          NO_COLOR: "1"

      - name: Package release archive
        run: >-
          python scripts/package_release.py
          --dist dist
          --output release
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: release
          merge-multiple: true

      - name: Generate combined checksums
        run: python scripts/checksums.py release

      - name: List release files
        run: ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: JAR ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
